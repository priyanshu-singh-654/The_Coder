<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Header + Square Card</title>
  <style>
    body {
      margin: 0;
      background-color: #f2f2f2; /* Light grey background as you originally said */
      font-family: Arial, sans-serif;
    }

    /* Header Banner */
    .header-banner {
      background: linear-gradient(to right, #007BFF, #00FFFF);
      color: white;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      padding: 20px 0;
    }

    /* Card Layout */
    .card {
      margin: 50px auto;
      padding: 20px;
      max-width: 500px;
      background-color: #f2f2f2; /* Light grey card */
      border: 1px solid #ccc;
      border-radius: 4px; /* Less rounded = more square */
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.1);
    }

    .card h3 {
      margin-top: 0;
      color: #333; /* Dark grey heading */
    }

    .card p {
      color: #444; /* Dark grey body text */
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header-banner">
    Institutional Header or Section Title
  </div>

  <!-- Card -->
  <div class="card">
    <h3>Evaluator Comments</h3>
    <p>This is a card</p>
  </div>

</body>
</html>
