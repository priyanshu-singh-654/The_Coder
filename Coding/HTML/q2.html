<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DevOps Practical Assessment Portal</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #ffffff;
    }

    /* Header Banner */
    .header-banner {
      background: linear-gradient(to right, #007BFF, #00FFFF); /* Blue to Cyan */
      color: white;
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      padding: 20px 0;
    }

    /* Paragraph Style */
    .info-paragraph {
      background-color: #fff9db; /* Soft yellow background */
      color: #444; /* Dark grey text */
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      text-indent: 2em; /* Indent first line */
      border-radius: 4px;
      font-size: 16px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <!-- Header Banner -->
  <div class="header-banner">
    DevOps Practical Assessment Portal
  </div>

  <!-- Info Paragraph -->
  <div class="info-paragraph">
    This paragraph begins with an indent. It uses soft yellow background and grey text for easy reading.
  </div>

</body>
</html>
