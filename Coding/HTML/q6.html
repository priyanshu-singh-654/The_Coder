<!DOCTYPE html>
<html>
<head>
    <title>Table Design</title>
    <style>
        table, td {
            border: 1px solid black;
            border-collapse: collapse;
            width: 600px;
            height: 300px;
            text-align: center;
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td rowspan="2"></td>
            <td></td>
            <td rowspan="2" colspan="2"></td>
        </tr>
        <tr>
            <td rowspan="2"></td>
        </tr>
        <tr>
            <td colspan="2"></td>
            <td></td>
        </tr>
        <tr>
            <td colspan="2"></td>
            <td colspan="2"></td>
        </tr>
    </table>
</body>
</html>
