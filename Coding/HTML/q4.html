<!DOCTYPE html>
<html>
<head>
  <title>Table With Borders and Padding</title>
  <style>
    table {
      border-collapse: collapse;
      width: 100%;
    }

    th, td {
      border: 1px solid black;
      padding: 10px;
      text-align: left;
    }

    th {
      background-color: #ffe699; /* Light yellow */
    }
  </style>
</head>
<body>

  <h2>Table With Borders and Padding</h2>

  <table>
    <tr>
      <th>Name</th>
      <th>Job Title</th>
      <th>Email address</th>
    </tr>
    <tr>
      <td>Anna Fitzgerald</td>
      <td>Staff Writer</td>
      <td>example@company.com</td>
    </tr>
    <tr>
      <td>John Smith</td>
      <td>Marketing Manager</td>
      <td>example2@company.com</td>
    </tr>
    <tr>
      <td>Zendaya Grace</td>
      <td>CEO</td>
      <td>example2@company.com</td>
    </tr>
  </table>

</body>
</html>
